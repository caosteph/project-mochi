name: Secrets

# Rule 5 (secrets never get committed), enforced in code. On a public repo a pushed key is
# unrecoverable — it stays in history after any deletion — so the pre-push hook runs the same
# project check BEFORE anything leaves the machine; this job is the backstop for a push that
# skipped the hook (--no-verify, a fresh clone without scripts/install_hooks.sh, the web editor).
#   1. scripts/check_secrets.py — stdlib, the formats this project actually holds, full history.
#   2. gitleaks — the broad community ruleset, as a second opinion.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: a secret deleted in a later commit is still a leak
      - name: Project secret scan (full history)
        run: python3 scripts/check_secrets.py --all
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
